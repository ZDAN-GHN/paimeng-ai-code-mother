# 本地开发基础设施：MySQL + Redis + SearXNG + Nginx（应用服务 Java / TS Agent / 前端仍在宿主机运行）
# 使用：仓库根目录执行 docker compose up -d；环境变量见 .env.example（复制为 .env 后修改）
name: paimeng-infra

services:
  mysql:
    image: mysql:8.0.46
    container_name: paimeng-mysql
    restart: unless-stopped
    # 仅监听本机回环，不暴露到局域网
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在仓库根目录 .env 中设置 MYSQL_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动（数据卷为空）时自动建库建表，之后不会重复执行
      - ./infra/sql/create_table.sql:/docker-entrypoint-initdb.d/01-create_table.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  postgres:
    image: pgvector/pgvector:pg16
    container_name: paimeng-postgres
    restart: unless-stopped
    # 仅监听本机回环；TS Agent 直连会话事件库，RAG v2 复用此实例并分库
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-paimeng}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在仓库根目录 .env 中设置 POSTGRES_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./infra/sql/pg/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7.2
    container_name: paimeng-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  searxng:
    image: searxng/searxng:latest
    container_name: paimeng-searxng
    restart: unless-stopped
    # 仅监听本机回环，不暴露到局域网；宿主机端口用 8888，避开 Tomcat/Spring Boot 默认的 8080
    ports:
      - "127.0.0.1:8888:8080"
    environment:
      SEARXNG_BASE_URL: http://127.0.0.1:8888/
    volumes:
      - ./infra/docker/searxng/settings.yml:/etc/searxng/settings.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  nginx:
    image: nginx:alpine
    container_name: paimeng-nginx
    restart: unless-stopped
    # 部署产物访问入口：http://localhost/{deployKey}（与 Java CODE_DEPLOY_HOST、前端 VITE_DEPLOY_DOMAIN 一致）
    # 80 端口由 docker daemon 绑定，宿主无需 root；仅监听本机回环
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - ./infra/docker/nginx/deploy.conf:/etc/nginx/conf.d/default.conf:ro
      # 部署产物目录只读挂载（写入方为宿主机 Java 进程）
      - ./runtime/tmp/code_deploy:/srv/code_deploy:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  mysql-data:
  pg-data:
  redis-data:
