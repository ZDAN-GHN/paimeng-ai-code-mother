# 部署产物静态路由（本地开发，对齐 deploy/nginx.conf.example 的生产拓扑中「部署应用访问」段）
# Java 部署产物落宿主机 tmp/code_deploy/{deployKey}/（AppConstant.CODE_DEPLOY_ROOT_DIR），
# 访问 URL = http://localhost/{deployKey}（与 Java CODE_DEPLOY_HOST、前端 VITE_DEPLOY_DOMAIN 一致）。
# 产物为纯静态（无服务端依赖），平台自身路由（/api、/agent）由 Vite 代理承担，不经此 server。

server {
    listen 80;
    server_name localhost;

    root /srv/code_deploy;
    index index.html;

    # /{deployKey} → {deployKey}/index.html；wireframe/ 等子目录文件同样可达
    location / {
        try_files $uri $uri/ =404;
    }

    # 容器探活（deployKey 为 6 位随机串，不会碰撞）
    location = /healthz {
        return 200 'ok';
    }
}
