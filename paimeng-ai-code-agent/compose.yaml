name: paimeng-ts-refactor
# 本仓库不再自带 Postgres：产品库与 harness 存储都放在这台机器已有的 Postgres 16 实例里
# （127.0.0.1:5432，四个 database，连接串在 .env，见 README「使用本机自己的数据库容器」）。
services:
  mysql:
    container_name: zslm-mysql
    image: mysql:8.0.46
    restart: unless-stopped
    ports: ["127.0.0.1:3306:3306"]
    environment:
      MYSQL_DATABASE: paimeng_ai_code_mother_ts
      MYSQL_USER: paimeng_ts
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes: ["./runtime/mysql:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 3s
      timeout: 3s
      retries: 30
  redis:
    container_name: zslm-redis
    image: redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    restart: unless-stopped
    ports: ["127.0.0.1:6379:6379"]
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--protected-mode", "no"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 3s
      timeout: 3s
      retries: 30
volumes:
  redis-data:
    name: paimeng-ts-refactor-redis-data
