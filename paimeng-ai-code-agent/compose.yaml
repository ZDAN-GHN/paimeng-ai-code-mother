name: paimeng-ts-refactor
services:
  # 固定 Postgres 16 服务（本机一次性容器的升级版）。端口固定 55432，避开 zslm-postgres 的 5432。
  # 数据目录沿用 dev 的绑定挂载以保留已迁移的数据；credentials 只是本机丢弃式取值。
  postgres:
    container_name: zslm-pg-paimeng
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    ports: ["127.0.0.1:55432:5432"]
    environment:
      POSTGRES_USER: spike
      POSTGRES_PASSWORD: spike
      POSTGRES_DB: paimeng_agent
    volumes: ["./runtime/durable-pg/pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spike -d paimeng_agent"]
      interval: 3s
      timeout: 3s
      retries: 30
  mysql:
    container_name: zslm-mysql
    image: mysql:8.0.46
    restart: unless-stopped
    ports: ["127.0.0.1:3306:3306"]
    environment:
      MYSQL_DATABASE: paimeng_ai_code_mother_ts
      MYSQL_USER: paimeng_ts
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes: ["./runtime/mysql:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 3s
      timeout: 3s
      retries: 30
  redis:
    container_name: zslm-redis
    image: redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    restart: unless-stopped
    ports: ["127.0.0.1:6379:6379"]
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--protected-mode", "no"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 3s
      timeout: 3s
      retries: 30
volumes:
  redis-data:
    name: paimeng-ts-refactor-redis-data
