spring:
  # 项目名称
  application:
    name: paimeng-code-backend
  # session 管理配置 - 后端
  session:
    store-type: redis
    timeout: 2592000s
  # mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/paimeng_ai_code_mother
    username: root
    password: root
  flyway:
    # 既有环境由初始化 SQL 建表；以版本 0 建立历史后只应用新增 Platform migration。
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
  # redis
  data:
    redis:
      host: localhost
      password:
      port: 6379
      database: 0
  profiles:
    active: local


# 端口 根路径
server:
  port: 8123
  servlet:
    context-path: /api
    # session 管理配置 - 前端：设置 cookie 过期时间（30天），不设置的话前端不会将 cookie 持久化，关闭浏览器后登录态丢失
    session:
      cookie:
        max-age: 2592000s

# TS Agent 链路配置（Issue #14 收官切换，原 python-agent.*/agent.* 段随中转链退役）
ts-agent:
  # 灰度开关：门禁 /app/agent/token 的 JWT 签发（false 时前端得到明确报错）；旧 Java AI 链路已删除，回退手段为 git 回滚
  enabled: ${TS_AGENT_ENABLED:true}
  # 短时 JWT（Issue #12）：登录态换取浏览器直连 TS Agent 的令牌；secret 与 TS Agent 侧 JWT_SECRET 取同一值
  jwt:
    secret: ${TS_AGENT_JWT_SECRET:}
    ttl-minutes: ${TS_AGENT_JWT_TTL_MINUTES:10}

# springdoc
springdoc:
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.zdan.paimengaicodebackend.controller

# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn


