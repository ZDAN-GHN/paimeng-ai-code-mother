spring:
  # 项目名称
  application:
    name: paimeng-code-mother-backend
  # session 管理配置 - 后端
  session:
    store-type: redis
    timeout: 2592000s
  # mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/paimeng_ai_code_mother
    username: root
    password: root
  # redis
  data:
    redis:
      host: localhost
      password:
      port: 6379
      ttl: 3600
      database: 0
  profiles:
    active: local


# 端口 根路径
server:
  port: 8123
  servlet:
    context-path: /api
    # session 管理配置 - 前端：设置 cookie 过期时间（30天），不设置的话前端不会将 cookie 持久化，关闭浏览器后登录态丢失
    session:
      cookie:
        max-age: 2592000s

# Python Agent 迁移开关。生产通过环境变量覆盖 token/base-url。
python-agent:
  enabled: ${PYTHON_AGENT_ENABLED:false}
  base-url: ${PYTHON_AGENT_BASE_URL:http://localhost:8090}
  token: ${PYTHON_AGENT_TOKEN:}
  connect-timeout-ms: ${PYTHON_AGENT_CONNECT_TIMEOUT_MS:3000}
  read-timeout-ms: ${PYTHON_AGENT_READ_TIMEOUT_MS:300000}
  # 主通道结束后等待完成回调的最长时间，超时未收到回调则判定失败
  callback-timeout-ms: ${PYTHON_AGENT_CALLBACK_TIMEOUT_MS:60000}

# springdoc
springdoc:
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.zdan.paimengaicodemother.controller

# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn


