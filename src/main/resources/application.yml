spring:
  # 项目名称
  application:
    name: paimeng-code-mother-backend
  # session 管理配置 - 后端
  session:
    store-type: redis
    timeout: 2592000s
  # mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/paimeng_ai_code_mother
    username: root
    password: root
  # redis
  data:
    redis:
      host: localhost
      password:
      port: 6379
      ttl: 3600
      database: 0
  profiles:
    active: local


# 端口 根路径
server:
  port: 8123
  servlet:
    context-path: /api
    # session 管理配置 - 前端：设置 cookie 过期时间（30天），不设置的话前端不会将 cookie 持久化，关闭浏览器后登录态丢失
    session:
      cookie:
        max-age: 2592000s

# Agent 客户端迁移开关（泛化自 python-agent.*，Issue #6）：代码层已绑定 agent.* 前缀，
# 此处保留 python-agent.* 段作为旧别名（AgentLegacyAliasPostProcessor 自动复制到 agent.*），
# 向后兼容既有部署；新配置请直接使用 agent.*（环境变量 AGENT_ENABLED/AGENT_BASE_URL/AGENT_TOKEN 等）。
python-agent:
  enabled: ${PYTHON_AGENT_ENABLED:false}
  base-url: ${PYTHON_AGENT_BASE_URL:http://localhost:8090}
  token: ${PYTHON_AGENT_TOKEN:}
  connect-timeout-ms: ${PYTHON_AGENT_CONNECT_TIMEOUT_MS:3000}
  read-timeout-ms: ${PYTHON_AGENT_READ_TIMEOUT_MS:300000}
  # 主通道结束后等待完成回调的最长时间，超时未收到回调则判定失败
  callback-timeout-ms: ${PYTHON_AGENT_CALLBACK_TIMEOUT_MS:60000}

# Java 内部 API（TS Agent 调用 generation_run 等内部端点时校验的 Bearer 服务令牌）
internal-api:
  token: ${INTERNAL_API_TOKEN:}

# springdoc
springdoc:
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.zdan.paimengaicodemother.controller

# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn


