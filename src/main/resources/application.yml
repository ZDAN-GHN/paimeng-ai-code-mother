spring:
  # 项目名称
  application:
    name: paimeng-code-mother-backend
  # session 管理配置 - 后端
  session:
    store-type: redis
    timeout: 2592000s
  # mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/paimeng_ai_code_mother
    username: root
    password: root
  # redis
  data:
    redis:
      host: localhost
      password:
      port: 6379
      database: 0
  profiles:
    active: local


# 端口 根路径
server:
  port: 8123
  servlet:
    context-path: /api
    # session 管理配置 - 前端：设置 cookie 过期时间（30天），不设置的话前端不会将 cookie 持久化，关闭浏览器后登录态丢失
    session:
      cookie:
        max-age: 2592000s

# TS Agent 链路配置（Issue #14 收官切换，原 python-agent.*/agent.* 段随中转链退役）
ts-agent:
  # 灰度开关：门禁 /app/agent/token 的 JWT 签发（false 时前端得到明确报错）；旧 Java AI 链路已删除，回退手段为 git 回滚
  enabled: ${TS_AGENT_ENABLED:true}
  # 线框生成每用户每日限频（滚动 24 小时窗口，免费 + 与积分体系无关）
  wireframe-daily-limit: ${TS_AGENT_WIREFRAME_DAILY_LIMIT:10}
  # 积分计费（Issue #10，架构 §7 按次 + 档位系数；冻结额 = 基础价 × 生成类型系数 × 强度档系数）
  credit:
    base-price: ${TS_AGENT_CREDIT_BASE_PRICE:100}
    # 生成类型系数：html/multi_file/vue_project
    html-multiplier: 1
    multi-file-multiplier: 2
    vue-project-multiplier: 3
    # 强度档位系数：fast/standard/deep（与 TS Agent INTENSITY_TIERS.priceMultiplier 对齐；快速档 0.5 折扣）
    fast-multiplier: 0.5
    standard-multiplier: 1
    deep-multiplier: 2
    # 中断折算：已写文件且进入 review（里程碑≥3）按此比例结算，否则按基础比例（剩余部分退款）
    interrupted-advanced-settle-ratio: 0.7
    interrupted-basic-settle-ratio: 0.5
  # 短时 JWT（Issue #12）：登录态换取浏览器直连 TS Agent 的令牌；secret 与 TS Agent 侧 JWT_SECRET 取同一值
  jwt:
    secret: ${TS_AGENT_JWT_SECRET:}
    ttl-minutes: ${TS_AGENT_JWT_TTL_MINUTES:10}

# Java 内部 API（TS Agent 调用 generation_run 等内部端点时校验的 Bearer 服务令牌）
internal-api:
  token: ${INTERNAL_API_TOKEN:}

# springdoc
springdoc:
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.zdan.paimengaicodemother.controller

# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn


